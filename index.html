<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>NEXUS RACER — A Browser Flight Game</title>

<!--
  SOCIAL SHARE CARDS
  ------------------
  og:image works best as an ABSOLUTE url — Twitter/X resolves relative paths but
  LinkedIn and Facebook are inconsistent about it. Once the prod domain is known,
  set SITE_URL below to it (no trailing slash) and prefix the two image tags:

      <meta property="og:image" content="https://your-domain.com/social-card.jpg">
      <meta name="twitter:image" content="https://your-domain.com/social-card.jpg">

  Regenerate the card any time the art changes:  npm run dev  →  /?card=1
-->
<meta name="description" content="An endless, procedurally generated low-poly world and three ways to fly it: hunt guarded caches, race an infinite gate track against five rivals, or just drift. 18 craft, built for the browser." />
<meta name="theme-color" content="#05060f" />
<link rel="icon" href="/nexusracer_logo.png" />
<link rel="apple-touch-icon" href="/nexusracer_logo.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Nexus Racer" />
<meta property="og:title" content="NEXUS RACER — A Browser Flight Game" />
<meta property="og:description" content="An endless, procedurally generated low-poly world and three ways to fly it: hunt guarded caches, race an infinite gate track against five rivals, or just drift. 18 craft, built for the browser." />
<meta property="og:image" content="/social-card.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A patriotic-liveried starfighter banking over a low-poly island coastline, with the Nexus Racer logo." />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="NEXUS RACER — A Browser Flight Game" />
<meta name="twitter:description" content="An endless procedural world and three ways to fly it. 18 craft, built for the browser." />
<meta name="twitter:image" content="/social-card.jpg" />
<meta name="twitter:image:alt" content="A starfighter banking over a low-poly island coastline, with the Nexus Racer logo." />
<style>
  :root{
    --cyan:#5ef2ff; --mag:#ff4fd8; --lime:#b6ff3d; --amber:#ffb347;
    --bg0:#05060f; --bg1:#0b0f22; --ink:#e8f4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
    font-family:"Rajdhani","Chakra Petch",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    /* stop the pull-to-refresh / rubber-band bounce behind the game */
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;}
  /* scoped to the WebGL surface — the HUD has its own canvases.
     touch-action lives here rather than on <body> so the hangar's side panels
     can still be scrolled with a finger. */
  #app canvas{display:block;position:fixed;inset:0;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hidden{display:none !important}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
